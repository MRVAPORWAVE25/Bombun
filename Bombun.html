<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Bombun</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="Bombun.icon.png" />
<link rel="apple-touch-icon" href="Bombun.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="Bombun.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
			// Merge Bombun.pck parts into a single Blob and intercept requests for Bombun.pck
			function pad(n, width = 2) {
				return String(n).padStart(width, '0');
			}
			function getParts(base, start, end) {
				const parts = [];
				for (let i = start; i <= end; i++) {
					parts.push(`${base}.part${pad(i)}`);
				}
				return parts;
			}
			function mergeFiles(fileParts) {
				return new Promise((resolve, reject) => {
					const buffers = [];
					let idx = 0;
					function fetchPart() {
						if (idx >= fileParts.length) {
							const mergedBlob = new Blob(buffers, { type: 'application/octet-stream' });
							resolve(mergedBlob);
							return;
						}
						const partUrl = fileParts[idx++];
						fetch(partUrl).then((res) => {
							if (!res.ok) throw new Error('Missing part: ' + partUrl);
							return res.arrayBuffer();
						}).then((ab) => {
							buffers.push(ab);
							// update status UI if present
							const prog = document.getElementById('status-progress');
							if (prog) {
								prog.value = idx;
								prog.max = fileParts.length;
							}
							fetchPart();
						}).catch(reject);
					}
					fetchPart();
				});
			}

			// Adjust these to match available parts; this project has parts 01..35
			const parts = getParts('Bombun.pck', 1, 35);

			// Start merging immediately so the engine can request Bombun.pck later
			window.__Bombun_merge_promise = mergeFiles(parts).then((blob) => {
				// Create a Blob URL and patch window.fetch to return the blob when Bombun.pck is requested
				const blobUrl = URL.createObjectURL(blob);
				window.__Bombun_pck_blobUrl = blobUrl;

				const originalFetch = window.fetch.bind(window);
				window.fetch = function(input, init) {
					try {
						const url = (typeof input === 'string') ? input : (input && input.url ? input.url : '');
						if (url && url.endsWith('Bombun.pck')) {
							// Return a Response directly from the merged blob
							return Promise.resolve(new Response(blob.slice(), {
								status: 200,
								headers: { 'Content-Type': 'application/octet-stream' }
							}));
						}
					} catch (e) {
						// fallthrough to original fetch
					}
					return originalFetch(input, init);
				};

				// Also provide a global URL in case the engine wants to use it directly
				return blobUrl;
			}).catch((err) => {
				console.error('Failed to merge pck parts:', err);
				const statusNotice = document.getElementById('status-notice');
				if (statusNotice) statusNotice.textContent = 'Failed to load game files: ' + err.message;
				throw err;
			});
		</script>

		<script src="Bombun.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"Bombun","experimentalVK":false,"fileSizes":{"Bombun.pck":822458316,"Bombun.wasm":35734203},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall — extend timeout to avoid premature fallback
				new Promise((resolve) => {
					setTimeout(() => resolve(), 86400000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');

		// Ensure merged Bombun.pck is ready before the engine attempts to load it.
		// If the merge promise is missing, proceed immediately (backwards compatible).
		const pckReady = (window.__Bombun_merge_promise) ? Promise.resolve(window.__Bombun_merge_promise).catch((err) => {
			// If merging failed, surface the error and still attempt to start to produce the original error flow
			console.error('PCK merge failed (continuing):', err);
			return null;
		}) : Promise.resolve(null);

		pckReady.then(() => {
			return engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			});
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
